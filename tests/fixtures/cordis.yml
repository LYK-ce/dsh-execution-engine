# 阶段 1 的最小真实组合：系统提示 + 工具注册表 + Node PTC 执行缝 + 本插件的 host 半边。
# 阶段 2 追加：会话存储（驱动要一个真实的发起 agent）、子 agent 服务与脚本化 provider。
# 阶段 3 追加：agent 注册表与后台 job 注册表（run_program 现在是后台 job）。
#
# 相对行名以本文件所在目录为基准（Include 把 baseUrl 设成配置目录，
# vendor/include/src/index.ts:188），所以 ../../host/index.ts 就是插件的入口。
#
# PTC provider 的 inject 是 ['fs', 'subprocess', 'sandbox', 'sandboxPolicy']，
# sandboxPolicy 的 inject 是 ['sessionProjections']，子 agent 服务的 host 半边还需要
# 本插件的 inject 里有 'subagents'，所以这一串缺一个它就不会激活（phase1-plan R1、phase2-plan R4）。
# mode 取 danger-full-access：本驱动要跑真进程，不需要文件沙箱。
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    # 驱动没有发起会话，cwd 走部署兜底；用仓库根，`python` 与临时目录都在预料之内。
    workspaceRoot: !!js process.cwd()

- id: fs
  name: '@deepseek-ai/dsh-fs-local'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: ptc-runtime
  name: '@deepseek-ai/dsh-ptc-runtime-node'
  config:
    # 超时用例只给 1s，终止阶梯要快，否则"耗时显著小于 30s"这条判据会变钝。
    graceMs: 500

- id: subagents
  name: '@deepseek-ai/dsh-subagent'

# 替掉需要模型 route 的 `spawn`：keyless 的确定性 provider（phase2-plan §5）。
- id: scripted-subagent
  name: './scripted-subagent-provider.ts'

# 阶段 8 追加：`dispatchsubagent` 的显式子 agent 模型路由**授权来源**。
#
# 引擎读它走 `ctx.get('subagentModelSelection')`（不在 `inject` 里，理由与 connection 同一条：
# 它是部署特性，缺席只该让"程序显式指定路由"被响亮地拒绝），所以这一行不是为了本插件激活，
# 而是让 B15 能验"清单里那条 route 真的被放行、清单外那条真的被拒"。
#
# provider/model 这里指的是 **LLM 路由 id**，与上面那个 `subagentProvider: scripted` 是两个命名
# 空间：前者是子 agent 用什么模型，后者是子 agent 由哪个 provider 起。两者刻意取了不同的名字，
# 这样"引擎原样转发、不去猜"在断言里才看得见。
- id: subagent-model-selection
  name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
  config:
    enabled: true
    allowedModels:
      - provider: scripted-provider
        model: scripted-model

# 阶段 3 追加：后台 job 注册表与 agent 注册表。
# job 的 owner 必须是**活着的、已注册的** agent 实例——jobs-local 的 `ensureOwnerCleanup` 会比对
# `agents.get(ownerId) === owner`，不等就直接拒绝（packages/jobs/jobs-local/src/index.ts:448-456）。
# 所以驱动不能再用一个只有 id 的替身当发起者。
- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'

# 阶段 6 追加：**不是为了本插件激活**——面板的两条路由走可选注入，没有 connection 时引擎照样
# 能跑程序（headless 部署就是这种）。加这两行是为了让 **B14** 在组合里拿到真实的 connection，
# 从而从 `ctx.connection.fetch` 上验两条面板路由真的挂上了。connection 自己的 inject 是
# ['credentials']，所以这一串缺一个，B14 就拿不到服务。
#
# credentials-local 要一个持久化凭据文档：默认落在 harness home（与 dsh web 同一份，即
# `$DSH_HOME/.credentials.yaml` 或 `~/.dsh/.credentials.yaml`）。connection 在那里取/建浏览器
# 会话密钥——这正是 dsh web 每次启动做的事。**不想让它碰真实 home 时，给驱动一个临时 DSH_HOME**：
#   $env:DSH_HOME = <临时目录>; node --import tsx/esm ...
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    watch: false

- id: client-connection
  name: '@deepseek-ai/dsh-client-connection'

- id: execution-engine-host
  name: '../../host/index.ts'
  config:
    # B6 要证明 provider 取的是 Config 里的值，而不是写死在引擎里的默认名。
    subagentProvider: scripted
